name: Public studio QA
on: pull_request
permissions:
  contents: read
jobs:
  accounts-storage-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest playwright aiosmtpd
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_public_studio.py tests/test_google_login.py tests/test_storage_archive_api.py tests/test_storage_api.py
      - run: python qa/public_studio_browser.py
